:root{
  --ink:#1f2430; --paper:#ffffff; --bg:#f1f3f7; --line:#e1e4ea; --sky:#4dabf7; --sky2:#2b8fe0; --skyl:#e7f3fe;
  --pink:#fbe3e7; --pink2:#e5536b; --pinkl:#fdeef0; --gray:#c9ced6; --grayl:#eef0f4; --moss:#6cc08b; --warn:#f5c451;
  --font:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:13px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap;font-weight:600}
button:hover{background:#f6f7f9}
button.pri{background:var(--sky);border-color:var(--sky);color:#fff} button.pri:hover{background:var(--sky2)}
button.pk{color:var(--pink2);border-color:#f3c2cb} button.pk:hover{background:var(--pinkl)}
button.sm{padding:3px 8px;font-size:12px;border-radius:6px}
button.ghost{border-color:transparent;background:transparent;font-weight:400}
button.ghost:hover{background:var(--grayl)}
input,select,textarea{background:#f6f7f9;border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:0;background:#fff}
textarea{width:100%;resize:vertical;min-height:62px;display:block}
input[type=number]{width:64px} input[type=color]{padding:0;width:34px;height:28px}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--sky);vertical-align:-2px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#7a8090}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}
.muted{color:#8a90a0;font-size:12px;font-weight:400}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
h2,h3{margin:0;font-weight:700} h2{font-size:16px} h3{font-size:13px}
.tag{display:inline-block;white-space:nowrap;border-radius:6px;padding:1px 7px;font-size:11px;background:var(--grayl);color:#555c6b}
.tag.sky{background:var(--skyl);color:var(--sky2)} .tag.pk{background:var(--pinkl);color:var(--pink2)} .tag.moss{background:#e4f5ea;color:#3a8f5b}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.st.draft{background:var(--gray)} .st.review{background:var(--warn)} .st.final{background:var(--moss)}

#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:20;background:var(--bg)}
#title .note,#title .tongue{display:none}
#title .logo{font-size:44px;font-weight:800;line-height:1.1;margin-bottom:28px}
#title .sub{font-size:14px;color:#8a90a0;margin-bottom:24px}
#title .btns{display:flex;flex-direction:column;gap:8px;width:260px}
#title .btns button{font-size:14px;padding:11px}

#app{display:flex;height:100%}
#side{width:216px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .12s}
#app.closed #side{width:0;border-right:0}
#side .in{width:215px;display:flex;flex-direction:column;height:100%}
#side .brand{padding:14px 14px 10px}
#side .brand b{font-size:17px;font-weight:800}
#side .brand span{display:block;font-size:11px;color:#8a90a0}
#side nav{padding:0 8px 8px;border-bottom:1px solid var(--line)}
#side nav button{display:block;width:100%;text-align:left;border:0;padding:7px 8px;font-weight:500;margin-top:2px}
#side nav button.on{background:var(--skyl);color:var(--sky2);font-weight:700}
#cal{overflow:auto;padding:10px;flex:1}
#cal h4{margin:10px 0 4px;font-size:13px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.days button{padding:0;height:25px;font-size:11px;font-weight:600;border-radius:6px;position:relative;font-family:ui-monospace,Consolas,monospace}
.days button.has:after{content:"";position:absolute;right:2px;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--moss)}
.days.wk{font-size:10px;color:#8a90a0;text-align:center;margin-bottom:2px}
.days .sun{color:#cf4d49}.days .sat{color:#3a74cc}
.days button.closed{background:repeating-linear-gradient(-45deg,#fff 0 4px,#eef0f4 4px 8px);color:#9aa0ad}
.days button.on{border:2px solid var(--sky);background:var(--skyl)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
#view{flex:1;min-height:0;padding:12px;overflow:auto;container-type:inline-size}
.tabs{display:flex;gap:0;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tabs button{border-radius:0;margin-left:-1px}
.tabs button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.tabs button:last-of-type{border-radius:0 8px 8px 0;margin-right:10px}
.tabs button.on{background:var(--sky);border-color:var(--sky);color:#fff;position:relative}
.tabs button.on .muted{color:#fff}
.badge{background:var(--pink2);color:#fff;border-radius:8px;padding:0 6px;margin-left:5px;font-size:11px}

.dlg{display:grid;grid-template-columns:240px minmax(340px,1fr) auto;gap:12px;height:100%}
.dlg>div{min-height:0;overflow:auto}
.dlgwrap{display:flex;flex-direction:column;height:100%}
.dlgwrap .dlg{flex:1;min-height:0}

.li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-weight:600}
.li:hover{background:#f6f7f9} .li.on{border-color:var(--sky);background:var(--skyl)}
.li small{display:block;color:#8a90a0;font-size:11px;font-weight:400}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--paper)}
.line.on{border-color:var(--sky);box-shadow:0 0 0 1px var(--sky)}
.line .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sub2{border-left:3px solid var(--sky);padding:2px 0 2px 10px;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.sub2.ch{border-color:#f3a8b5}
fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0 0;padding:10px;min-width:0}
legend{padding:0 6px;font-size:11px;color:#7a8090}
#pvbox{overflow:auto;padding:14px;border:1px solid var(--line);border-radius:10px;background:#e9edf2}
#pvc{image-rendering:pixelated;display:block;cursor:pointer}
.pvch{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.pvch button{text-align:left}
.warnbox{border-radius:8px;background:#fff6d9;padding:4px 8px;margin-top:6px;font-size:12px}
.errbox{border-radius:8px;background:var(--pinkl);color:#b93a50;padding:4px 8px;margin-top:6px;font-size:12px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
th{font-size:11px;color:#7a8090;font-weight:500}
td input[type=text]{width:100%}
.iss{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid var(--grayl);cursor:pointer}
.iss:hover{background:#f6f7f9}
.flow{border-left:2px solid var(--sky);margin-left:10px;padding-left:14px}
.fc{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 10px;margin:8px 0;max-width:560px;cursor:pointer}
.fc:hover{border-color:var(--sky)}
.fch{margin-left:18px;border-left:2px solid #f3a8b5;padding-left:10px}
#map{position:relative;border:1px solid var(--line);border-radius:4px;background-color:#dbe9f8;cursor:crosshair;background-size:cover;background-position:center;overflow:hidden;
  background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px)}
.mk{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--ink);border-radius:3px;width:14px;height:14px;pointer-events:none}
.mk span{position:absolute;left:16px;top:-4px;background:var(--paper);border:1px solid var(--line);border-radius:4px;font-size:11px;padding:0 4px;white-space:nowrap}
#tip{position:fixed;z-index:50;background:#1f2430;color:#fff;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;display:none;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#tip b{color:#9fd2fb;font-weight:600;display:inline-block;min-width:78px;font-family:ui-monospace,Consolas,monospace}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#1f2430;color:#fff;border-radius:10px;padding:8px 14px;display:none;gap:10px;align-items:center}
#toast button{color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(31,36,48,.4);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#modal .panel{width:min(680px,100%);max-height:90vh;overflow:auto}
#modal textarea{height:300px;font-size:12px}

.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--sky);border-color:var(--sky);color:#fff;position:relative}
.coordwrap{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;gap:12px;flex:1;min-height:0}
.coordwrap>div{min-height:0;overflow:auto}
.sec{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.sec h4{margin:0;font-size:11px;color:#7a8090;font-weight:500;border-bottom:1px solid var(--line);padding-bottom:4px}
.coordwrap .sec .row label{flex:1 1 70px}
.coordwrap .sec .row select,.coordwrap .sec .row input[type=number]{flex:1 1 70px;width:auto}
#cgrid{position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:1px}
.c{padding:0;border:0;border-radius:3px;font:600 calc(var(--cell)*.42)/1 ui-monospace,Consolas,monospace;color:#2b2d3a;display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:var(--cell-op);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c.blk{background:#f6b8b8} button.c{cursor:pointer}
.c.off,.c.off:hover{background:#b5d2f7;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.08)}
.c.off:hover{filter:brightness(1.06)}
.c.on,.c.on:hover{background:#b4e3bd;box-shadow:inset 0 3px 0 rgba(0,0,0,.22),inset 0 0 0 1px rgba(0,0,0,.12)}
.c.fix{box-shadow:inset 0 3px 0 rgba(0,0,0,.22),inset 0 0 0 1px rgba(0,0,0,.12)}
.c.org{outline:2px solid var(--ink);outline-offset:-2px}
.cm-edit .c,.cm-origin .c{cursor:crosshair}
#chover{font:600 20px ui-monospace,Consolas,monospace}
.sw{width:16px;height:16px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#2b2d3a}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{width:30px;height:30px;padding:0;border:2px solid transparent;font-size:15px;font-weight:400}
.picks button.on{border-color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#8a90a0;margin-left:auto}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
td.num{text-align:right;font:12px ui-monospace,Consolas,monospace;width:1px;white-space:nowrap}
@container (max-width:1180px){
  .dlgwrap{height:auto;display:block}
  .dlg,.coordwrap{display:flex;flex-direction:column;height:auto}
  .dlg>div,.coordwrap>div{overflow:visible;min-height:auto;flex:none}
  .coordwrap>div[data-sc=cmap]{overflow:auto}
  .dlg>div:first-child{order:-2;max-height:260px;overflow:auto}
  .pvcol{order:-1}
}
.gridwrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:8px}
.grid{width:max-content;min-width:100%}
.grid td,.grid th{padding:0;border:1px solid var(--line)}
.grid th{position:sticky;top:0;background:#f6f7f9;z-index:1;padding:0 6px}
.grid select{border:0;border-radius:0;background:transparent;width:100%;min-width:96px}
.grid input{border:0;border-radius:0;background:transparent;width:100%;min-width:96px;padding:5px 8px}
</style>
</head>

<script>
"use strict";
/* ---------- 기본 도우미 ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k]; if(v==null||v===false)continue;
    if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='class')e.className=v; else if(k==='value')e.value=v; else if(k==='checked')e.checked=v;
    else if(k==='style')e.style.cssText=v; else e.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function put(el,...kids){ el.replaceChildren(...kids.flat(Infinity).filter(c=>c!=null&&c!==false).map(c=>c.nodeType?c:document.createTextNode(String(c)))); }
const INK='#2b2f3a', SKY='#8fd0ee';
const TEXTCOL=['#2b2f3a','#2f7fb5','#d6557a','#3f9a63','#4aa3d0','#8a63c9','#b07a12','#8a909c'];
const TEXTCOLNAME=['기본','파랑','분홍','초록','하늘','보라','노랑','회색'];

const FX={affinity:'호감도',item:'아이템 해금',recipe:'레시피 해금'};
const MONTHS=[[6,30],[7,31],[8,31]], SPECIAL=['4-5','4-14'];
const ALLDATES=[...SPECIAL,...MONTHS.flatMap(([m,n])=>Array.from({length:n},(_,i)=>m+'-'+(i+1)))];
const dl=k=>{const [m,d]=k.split('-');return m+'월 '+d+'일';};
const LS='merongtool.autosave', LSF='merongtool.font';
let FONT='"Galmuri9","Galmuri11","DungGeunMo","NeoDunggeunmo","Neo둥근모","DOSGothic","Malgun Gothic",sans-serif'; // 미리보기(게임 화면) 전용 폰트

let db=null, undoSnap=null, saveT=null;
const ui={tool:'dialog',tab:'edit',dlg:null,line:0,date:null,dateOnly:true,q:'',fNpc:'',fStatus:'',fFlag:'',dbTab:'normal',pvOpen:false,flowNpc:'',coordNpc:''};

      {name:'아이템 (예시)',file:'IngredientDataTable',kind:'item',cols:['ID','CodeName','Name','맥스스택','몇번사용가능','물류업자에게 구매하는 가격'],rows:[['1','unknown_seed','이름 모를 씨앗','99','1','300']]}];

              {n:2,speaker:'1001',face:'웃음',text:'오늘은 \\{이끼 라떼\\} 한 잔 부탁해도 될까?',memo:'여기서 주문 UI 연출',effects:[],

      {id:'moss_visit1_yes',title:'첫 방문 - 수락',npc:'1001',status:'draft',entry:'link',seq:2,cond:{visit:'',affMin:'',affMax:'',mood:'',dates:[],flags:[]},
       lines:[{n:1,speaker:'1001',face:'웃음',text:'고마워.\\. 이건 답례야.',memo:'',effects:[{type:'item',target:'1',value:1}],choices:[]}]},

function normalize(d){ // 오래된 세이브·빠진 필드 보정
  const b=blankDB(false);
  for(const k in b) if(d[k]==null) d[k]=b[k];
  for(const [k,nm,kind] of [['items','아이템','item'],['recipes','레시피','recipe']]){ if(Array.isArray(d[k])&&d[k].length)d.tables.push({name:nm,kind,cols:['ID','Name','설명'],rows:d[k].map(r=>[r.id,r.name||'',r.desc||''])}); delete d[k]; }
  for(const t of d.tables){ if(!t.kind&&isDateCols(t.cols)&&!d.tables.some(x=>x.kind==='date'))t.kind='date'; }
  if(!d.tables.some(t=>t.kind==='date'))d.tables.unshift(defaultDateTable());
  fillOldDow(d.tables.find(x=>x.kind==='date'));
  ensureNpcCols(d);
  delete d.vars; delete d.flags; for(const n of d.npcs)n.kind=n.kind||'normal';
  d.preview=d.preview&&d.preview.v===2?Object.assign(b.preview,d.preview):b.preview; delete d.coords; delete d.map; d.coord=Object.assign(b.coord,d.coord);
  for(const g of d.dialogs){ g.cond=Object.assign({visit:'',affMin:'',affMax:'',mood:'',dates:[],flags:[]},g.cond); g.lines=g.lines||[]; g.entry=g.entry||'cond'; g.status=g.status||'draft';
    g.seq=g.seq||g.lines.length+1;
    for(const l of g.lines){ l.effects=(l.effects||[]).filter(f=>f.type!=='flag'); for(const c of l.choices||[])c.effects=(c.effects||[]).filter(f=>f.type!=='flag'); l.choices=l.choices||[]; l.memo=l.memo||''; if(!l.n)l.n=g.seq++; for(const c of l.choices)c.effects=c.effects||[]; } }
  return d;
}
function touch(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(LS,JSON.stringify({t:Date.now(),db}));}catch(e){ try{localStorage.setItem(LS,JSON.stringify({t:Date.now(),db:Object.assign({},db,{coord:Object.assign({},db.coord,{bg:null}),preview:Object.assign({},db.preview,{bubbleImg:'',standImg:'',stands:{}})})}));touch.lite=true;}catch(e2){} } const s=$('#saved'); if(s)s.textContent=(touch.lite?'자동 저장됨 (이미지는 용량 때문에 제외 · 세이브 저장에는 포함) ':'자동 저장됨 ')+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); },500); }
function snap(){ undoSnap=JSON.stringify(db); }
function toast(msg,undo){ const t=$('#toast'); put(t,msg, undo&&undoSnap? h('button',{class:'sm',onclick:()=>{db=JSON.parse(undoSnap);undoSnap=null;touch();render();t.style.display='none';}},'되돌리기'):null);
  t.style.display='flex'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',undo?6000:2600); }
function modal(title,body,btns){ const m=$('#modal'); put(m,h('div',{class:'panel'},h('div',{class:'row',style:'margin-bottom:8px'},h('h2',{class:'grow'},title),h('button',{class:'sm',onclick:closeModal},'닫기')),body,btns?h('div',{class:'row',style:'margin-top:8px;justify-content:flex-end'},btns):null)); m.style.display='flex'; }

function pickFile(accept,mode,cb){ const f=$('#file'); f.value=''; f.accept=accept; f.onchange=()=>{const file=f.files[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{ let v=r.result; if(mode==='csv'){ try{v=new TextDecoder('utf-8',{fatal:true}).decode(v);}catch(e){v=new TextDecoder('euc-kr').decode(v);} } cb(v,file); }; mode==='url'?r.readAsDataURL(file):mode==='csv'?r.readAsArrayBuffer(file):r.readAsText(file);}; f.click(); }
async function saveFile(name,text){
  let dlc=null, why='';
  try{ if(window.claude&&claude.use) dlc=await claude.use('downloads'); else why='이 화면에는 저장 기능이 연결돼 있지 않아요 (no-runtime)'; }catch(e){ why='저장 기능을 불러오지 못했어요 (use-failed)'; }
  if(dlc){ try{ await dlc.save({filename:name,data:text}); toast(name+' 저장했어요'); return; }
    catch(e){ const code=(e&&e.code)||'unknown'; if(code==='declined'){toast('저장을 취소했어요');return;}

function parseText(raw){
  const toks=[],unknown=[]; let i=0; raw=raw||'';

  const SIMPLE={'{':{t:'big'},'}':{t:'small'},'.':{t:'wait',ms:250},'|':{t:'wait',ms:1000},'!':{t:'input'},'>':{t:'fastOn'},'<':{t:'fastOff'},'^':{t:'noWait'}};

      if(m=rest.match(/^[Cc]\[(\d+)\]/)){toks.push({t:'color',n:+m[1]});i+=1+m[0].length;continue;}
      if(m=rest.match(/^[Nn]\[([\w-]+)\]/)){ if(m[1]!=='player'&&!npcOf(m[1]))unknown.push('\\N['+m[1]+']'); push(speakerName(m[1]));i+=1+m[0].length;continue;}
      if(rest[0]==='\\'){push('\\');i+=2;continue;}
      if(SIMPLE[rest[0]]){toks.push(Object.assign({},SIMPLE[rest[0]]));i+=2;continue;}
      push('\\');i++;continue; }
    if(c==='\n'){toks.push({t:'nl'});i++;continue;}
    toks.push({t:'ch',c}); i++; }
  return {toks,unknown};

function csvImport(){ pickFile('.csv,text/csv','text',txt=>{ const rows=csvParse(txt); if(!rows.length){toast('빈 파일이에요');return;} const hd=rows[0].map(s=>s.trim()), ki=hd.indexOf('key'), ti=hd.indexOf('text'), mi=hd.indexOf('memo');
  if(ki<0||ti<0){toast('key, text 열이 있어야 해요');return;} const map={};
  for(const d of db.dialogs)for(const l of d.lines){ map[lineKey(d,l)]={o:l,line:true}; l.choices.forEach((c,i)=>map[lineKey(d,l)+'_C'+(i+1)]={o:c}); }
  snap(); let n=0,miss=0; for(const r of rows.slice(1)){ if(!r[ki])continue; const m=map[r[ki]]; if(!m){miss++;continue;} if(m.o.text!==r[ti]||(m.line&&mi>=0&&m.o.memo!==r[mi]))n++; m.o.text=r[ti]??''; if(m.line&&mi>=0)m.o.memo=r[mi]??''; }
  touch(); render(); toast(n+'개 바뀜'+(miss?' · 키를 못 찾은 줄 '+miss+'개':''),true); }); }

/* ---------- 내보내기 묶음 ---------- */
function zipStore(files){ // 무압축 ZIP (UTF-8 파일명)
  const enc=new TextEncoder(), T=[]; for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}
  const crc=b=>{let c=~0;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return (~c)>>>0;};
  const parts=[],cen=[]; let off=0;
  for(const f of files){ const nm=enc.encode(f.name), d=f.data, c=crc(d);
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(12,0x21,true); lh.setUint32(14,c,true); lh.setUint32(18,d.length,true); lh.setUint32(22,d.length,true); lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(14,0x21,true); ch.setUint32(16,c,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm); off+=30+nm.length+d.length; }
  const csz=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csz,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
}
const NFILE={normal:'DataNpcCustomer',special:'DataNpcCustomerSpecial',band:'DataNpcBandMember',talk:'DataNpc'};
const XFILE={spawn:'NpcSpawnByDate',fixed:'NpcSpawnFixed',dialogue:'Dialogue'};
const fclean=n=>String(n||'').replace(/\.csv$/i,'').replace(/[\\/:*?"<>|]+/g,'_').trim();
function npcCSV(kind){ const xc=db.ncols[kind]||[]; return toCSV([['ID','CodeName','Name',...xc.map(c=>c.name),'Portraits'],...db.npcs.filter(n=>(n.kind||'normal')===kind).map(n=>[n.id,n.code||'',n.name,...xc.map(c=>(n.x||{})[c.key]??''),facesOf(n.id).join('|')])]); }
function spawnCSV(){ const S=db.coord, R=[['월','일','요일','DateID','시간대','NpcID','CodeName','Name','X','Y']], code=o=>o.npc&&npcOf(o.npc)?(npcOf(o.npc).code||''):'';
  for(const k of Object.keys(S.daily).sort((a,b)=>ALLDATES.indexOf(a)-ALLDATES.indexOf(b)))for(const [sid,sn] of SLOTS)for(const c in (S.daily[k][sid]||{})){ const o=S.daily[k][sid][c],p=kxy(c),[m,d]=k.split('-'); R.push([m,d,dowOf(k)>=0?DOW[dowOf(k)]:'',(DM[k]||{}).id||'',sn,o.npc||'',code(o),cname(o),p.x,p.y]); }
  return toCSV(R); }
function fixedCSV(){ const S=db.coord; return toCSV([['NpcID','CodeName','Name','X','Y','등장 시각','제외 날짜'],...Object.keys(S.fixed).map(c=>{const f=S.fixed[c],p=kxy(c);return [f.npc||'',f.npc&&npcOf(f.npc)?(npcOf(f.npc).code||''):'',cname(f),p.x,p.y,fixSlotTxt(f),fmtEx(f.except)];})]); }
function exportFiles(){ // 표시 이름(label)과 내보내기 파일 이름(file)을 따로 관리
  db.nfile=db.nfile||{}; db.xfile=db.xfile||{};
  const it=(label,obj,key,def,text)=>({label,def,text,raw:()=>obj[key]??'',set:v=>{obj[key]=v;},get file(){return fclean(obj[key])||def;}});
  return {db:[...NKL().map(([k,l])=>it(l,db.nfile,k,NFILE[k],npcCSV(k))),...db.tables.filter(t=>t.kind!=='date').map(t=>it(t.name||'이름 없는 표',t,'file',fclean(t.name)||'table',toCSV([t.cols,...t.rows])))],
    date:[...db.tables.filter(t=>t.kind==='date').map(t=>it(t.name||'날짜',t,'file','DateDataTable',toCSV([t.cols,...t.rows]))),it('날짜별 NPC 배치',db.xfile,'spawn',XFILE.spawn,spawnCSV()),it('고정 NPC',db.xfile,'fixed',XFILE.fixed,fixedCSV())],
    dlg:[it('대사',db.xfile,'dialogue',XFILE.dialogue,csvExport())]};
}
function zipOf(groups){ const enc=new TextEncoder(), used={};
  return zipStore(groups.flatMap(([dir,fs])=>fs.map(f=>{ let base=f.name?f.name.replace(/\.[^.]+$/,''):f.file, ext=f.name?f.name.slice(base.length):'.csv', n=(dir?dir+'/':'')+base, r=n, i=2; while(used[r+ext])r=n+'_'+(i++); used[r+ext]=1;
    return {name:r+ext,data:enc.encode((ext==='.csv'?'﻿':'')+f.text)}; }))); }
function exportModal(){
  const F=exportFiles(), nm=db.name||'merongdi';
  const row=f=>{ const e=h('input',{type:'text',value:f.raw(),placeholder:f.def,style:'width:210px'}); e.addEventListener('input',()=>{f.set(e.value);touch();});
    return h('div',{class:'row'},h('span',{class:'grow'},f.label),e,h('span',{class:'muted'},'.csv'),h('span',{class:'muted',style:'min-width:36px;text-align:right'},Math.max(0,f.text.split('\r\n').length-1)+'행'),h('button',{class:'sm',onclick:()=>saveFile(f.file+'.csv','﻿'+f.text)},'받기')); };
  const sec=(title,fs,dir)=>h('div',{class:'sec'},h('h4',{},title),fs.map(row),fs.length>1?h('div',{},h('button',{class:'sm',onclick:()=>saveFile(nm+'_'+dir+'.zip',zipOf([['',fs]]))},'이 묶음만 ZIP으로')):null);
  modal('내보내기',h('div',{},
      h('p',{class:'muted'},'왼쪽은 표시 이름, 입력칸은 내보낼 파일 이름이에요. 비워 두면 회색으로 보이는 기본 이름을 씁니다.'),
      sec('데이터베이스 — 손님 4분류 + 내가 만든 표',F.db,'database'),
      sec('날짜 데이터 — 날짜 표 + 좌표 툴의 날짜별 NPC 배치',F.date,'date'),
      sec('대사',F.dlg,'dialogue'),
      h('div',{class:'sec'},h('h4',{},'기타'),h('div',{class:'row'},h('button',{class:'sm',onclick:()=>saveFile(nm+'_unity.json',JSON.stringify(unityExport(),null,2))},'Unity JSON 받기'),h('button',{class:'sm',onclick:()=>{closeModal();csvImport();}},'대사 CSV 가져오기')))),
    h('button',{class:'pri',onclick:()=>saveFile(nm+'_all.zip',zipOf([['database',F.db],['date',F.date],['dialogue',F.dlg],['',[{name:'unity.json',text:JSON.stringify(unityExport(),null,2)},{name:'save.json',text:JSON.stringify(db)}]]]))},'전체 ZIP으로 내보내기'));
}
